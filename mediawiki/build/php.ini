log_errors = ${PHP_LOG_ERRORS}
error_reporting = ${PHP_ERROR_REPORTING}

; Values come from the environment so they can be tuned per instance without
; rebuilding. Every placeholder needs a default in the Dockerfile ENV block:
; an unset variable expands to empty and php warns.
; Note this file lands in conf.d, which is read after the main php.ini, so
; these win over the 128M and 30s that file ships with.
; Override default PHP settings
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
post_max_size = ${PHP_UPLOAD_MAX_FILESIZE}
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}

# https://www.mediawiki.org/wiki/Extension:Flow#.22maximum_function_nesting_level_of_.27100.27_reached.2C_aborting.22
xdebug.max_nesting_level = 200
