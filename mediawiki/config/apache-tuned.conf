# Mounted by docker-compose.tuned.example.override.yml.
#
# Raise only if ./docs/performance/stack-mem.sh shows "web workers" at or near
# the ceiling. A saturated pool queues requests, which looks like slowness
# while memory readings stay idle. Each worker is a process with its own php
# memory allowance, so the ceiling multiplied by memory_limit is the worst case
# this container can demand.
<IfModule mpm_prefork_module>
    MaxRequestWorkers 300
    ServerLimit 300
</IfModule>
