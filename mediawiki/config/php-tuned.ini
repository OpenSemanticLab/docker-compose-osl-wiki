; Mounted by docker-compose.tuned.example.override.yml into the apache conf.d
; directory. These apply to web requests only; maintenance scripts run under
; the cli ini, whose limits are already unbounded.

; A large result table or a wide form can exceed 128M. Raising this does not
; make anything faster, it stops a render dying half way.
memory_limit = 512M

; The image default is 30 seconds. A page that takes longer is killed, which
; reads as a broken page rather than a slow one. Keep it bounded: an unlimited
; value lets one expensive request occupy a worker indefinitely.
max_execution_time = 120
